<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | AI Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='error.css') }}">
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-icon">
                <svg width="120" height="120" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#F44336" stroke-width="2"/>
                    <path d="M15 9L9 15M9 9L15 15" stroke="#F44336" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            
            <h1 class="error-code">500</h1>
            <h2 class="error-title">Internal Server Error</h2>
            <p class="error-message">
                Something went wrong on our end.<br>
                Our team has been notified and we're working to fix it.
            </p>
        </div>
        
        <div class="illustration">
            <svg width="300" height="300" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Broken document illustration -->
                <path d="M100 80 L200 80 L200 200 L150 200" stroke="#F44336" stroke-width="3" fill="#FFEBEE"/>
                <path d="M150 200 L100 200 L100 80" stroke="#F44336" stroke-width="3" fill="none"/>
                <path d="M200 200 L300 200 L300 320 L250 320" stroke="#F44336" stroke-width="3" fill="#FFEBEE"/>
                <path d="M250 320 L200 320 L200 200" stroke="#F44336" stroke-width="3" fill="none"/>
                
                <!-- Lightning bolt -->
                <path d="M200 140 L180 200 L200 200 L180 260" stroke="#F44336" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                
                <!-- Decorative elements -->
                <circle cx="80" cy="100" r="15" fill="#EF5350" opacity="0.5"/>
                <circle cx="320" cy="280" r="20" fill="#EF5350" opacity="0.3"/>
                <circle cx="350" cy="120" r="10" fill="#F44336" opacity="0.4"/>
            </svg>
        </div>
    </div>
</body>
</html>
