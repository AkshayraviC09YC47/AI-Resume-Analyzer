<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AI Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-content">
        <div class="nav-left">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="30" cy="30" r="28" fill="#fff" opacity="0.2"/>
                    <path d="M30 10L35 20H25L30 10Z" fill="#fff"/>
                    <path d="M20 25H40V28H20V25Z" fill="#fff"/>
                    <path d="M22 32H38V35H22V32Z" fill="#fff"/>
                    <path d="M24 39H36V42H24V39Z" fill="#fff"/>
                    <path d="M26 46H34V49H26V46Z" fill="#fff"/>
                </svg>
            </div>
            <div class="nav-brand">
                <h2><span class="ai-text">AI</span> Resume Analyzer</h2>
                <p class="welcome-text">Welcome, <strong>{{ payload.sub }}</strong></p>
            </div>
        </div>
        <div class="nav-right">
            <a href="/dashboard" class="nav-link active">
                <i class="fas fa-th-large"></i>
                Dashboard
            </a>
            <a href="/history" class="nav-link">
                <i class="fas fa-history"></i>
                History
            </a>
            <a href="/logout" class="nav-link logout-link">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="main-container">
    
    <!-- EMPTY STATE -->
    <div id="uploadEmptyState" class="empty-state-card">
        <div class="card-illustration">
            <div class="document-icon">
                <i class="fas fa-file-pdf"></i>
            </div>
            <div class="floating-elements">
                <div class="float-icon float-1"><i class="fas fa-check"></i></div>
                <div class="float-icon float-2"><i class="fas fa-star"></i></div>
                <div class="float-icon float-3"><i class="fas fa-chart-line"></i></div>
            </div>
        </div>
        
        <div class="card-content">
            <h2 class="card-title">Upload Your Resume</h2>
            <p class="card-description">
                Get instant ATS score and detailed analysis<br>
                Select your resume PDF and click analyze to get started
            </p>
            
            <input id="resumeInput" type="file" accept=".pdf" hidden>
            <button id="primaryBtn" class="primary-btn">
                <i class="fas fa-upload"></i>
                Choose PDF File
            </button>
        </div>
    </div>

    <!-- UPLOAD CARD -->
    <div id="uploadCard" class="upload-card" style="display:none;">
        <div class="card-header">
            <div class="header-icon">
                <i class="fas fa-file-upload"></i>
            </div>
            <div class="header-text">
                <h3>Resume Analysis</h3>
                <p>Upload and analyze your resume</p>
            </div>
        </div>

        <form id="uploadForm" enctype="multipart/form-data">
            <input id="resumeInput2" type="file" name="resume" accept=".pdf" hidden>

            <div class="file-section">
                <div class="file-display">
                    <div class="file-info">
                        <i class="fas fa-file-pdf file-icon-pdf"></i>
                        <span id="fileText" class="file-name"></span>
                    </div>
                    <button type="button" id="removeFile" class="remove-btn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <button id="analyzeBtn" type="submit" class="analyze-button">
                    <i class="fas fa-brain"></i>
                    Analyze Resume
                </button>
            </div>
        </form>

        <div id="status" class="status-section" style="display:none;">
            <div class="spinner-wrapper">
                <div class="spinner"></div>
            </div>
            <p id="statusText" class="status-text">Analyzing resume</p>
        </div>

        <div id="outputWrapper" class="output-wrapper" style="display:none;">
            <div class="output-header">
                <i class="fas fa-file-alt"></i>
                <h4>Analysis Results</h4>
            </div>
            <div id="output" class="output-content"></div>
        </div>
    </div>

</div>

<script>
const emptyState = document.getElementById("uploadEmptyState");
const uploadCard = document.getElementById("uploadCard");

const resumeInput = document.getElementById("resumeInput");
const resumeInput2 = document.getElementById("resumeInput2");

const primaryBtn = document.getElementById("primaryBtn");
const analyzeBtn = document.getElementById("analyzeBtn");

const fileText = document.getElementById("fileText");
const removeFile = document.getElementById("removeFile");

const form = document.getElementById("uploadForm");
const output = document.getElementById("output");
const outputWrapper = document.getElementById("outputWrapper");
const status = document.getElementById("status");
const statusText = document.getElementById("statusText");

let dotsTimer;
let hasStartedStreaming = false;

/* Choose file */
primaryBtn.addEventListener("click", () => resumeInput.click());

resumeInput.addEventListener("change", () => {
    if (!resumeInput.files.length) return;

    resumeInput2.files = resumeInput.files;
    fileText.textContent = resumeInput.files[0].name;

    emptyState.style.display = "none";
    uploadCard.style.display = "block";
});

/* Remove file */
removeFile.addEventListener("click", () => {
    resumeInput.value = "";
    resumeInput2.value = "";
    fileText.textContent = "";

    uploadCard.style.display = "none";
    emptyState.style.display = "block";
});

/* Analyze animation */
function startAnalyzing() {
    status.style.display = "block";
    analyzeBtn.disabled = true;

    let dots = 0;
    dotsTimer = setInterval(() => {
        dots = (dots + 1) % 4;
        statusText.textContent = "Analyzing resume" + ".".repeat(dots);
    }, 500);
}

function stopAnalyzing() {
    clearInterval(dotsTimer);
    status.style.display = "none";
    analyzeBtn.disabled = false;
}

form.addEventListener("submit", async function (e) {
    e.preventDefault();

    output.textContent = "";
    outputWrapper.style.display = "none";
    hasStartedStreaming = false;
    startAnalyzing();

    const formData = new FormData(form);

    const response = await fetch("/analyze-stream", {
        method: "POST",
        body: formData
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value);

        if (!hasStartedStreaming && chunk.trim().length > 0) {
            outputWrapper.style.display = "block";
            hasStartedStreaming = true;
        }

        output.textContent += chunk;
        output.scrollTop = output.scrollHeight;
    }

    stopAnalyzing();
});
</script>

</body>
</html>
